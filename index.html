  /* Phones: fill the visible screen. A little horizontal artwork may be cropped
     on unusually tall screens, but the page never scrolls. */
  @media (max-width: 767px) {
    html, body { background: #000000; }
    .flyer {
      width: max(100vw, calc(100dvh * 770 / 1080));
      height: max(100dvh, calc(100vw * 1080 / 770));
    }
  }

  .hit {
    position: absolute;
    display: block;
    border: 0;
    padding: 0;
    margin: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    border-radius: 3.5cqw;
    text-decoration: none;
  }
  .hit:focus-visible {
    outline: 3px solid #00b9d7;
    outline-offset: 2px;
  }
  /* Transparent hit areas sit directly over the original artwork buttons. */
  .tracy { left: 20.45%; top: 37.85%; width: 61.12%; height: 5.95%; }
  .main-number { left: 20.45%; top: 69.45%; width: 61.12%; height: 5.95%; }
  .email { left: 20.45%; top: 76.2%; width: 61.12%; height: 5.95%; }
  .website { left: 20.45%; top: 83.0%; width: 61.12%; height: 5.95%; }

  .qr-wrap {
    position: absolute;
    left: 50%;
    top: 55.2%;
    transform: translate(-50%, -50%);
    width: 27%;
    aspect-ratio: 1;
    padding: 0;
    background: transparent;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }
  .qr-wrap img {
    display: block;
    width: 100%;
    height: 100%;
  }

  .dialog-backdrop {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(22, 8, 24, .48);
    z-index: 10;
  }
  .dialog-backdrop.open { display: flex; }
  .dialog {
    width: min(340px, 100%);
    padding: 22px;
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
    text-align: center;
  }
  .dialog h1 {
    margin: 0 0 7px;
    color: #701078;
    font-size: 21px;
  }
  .dialog p {
    margin: 0 0 18px;
    color: #444;
    font-size: 15px;
  }
  .choice {
    display: block;
    width: 100%;
    min-height: 48px;
    margin: 9px 0;

<div class="dialog-backdrop" id="choiceDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <div class="dialog">
    <h1 id="dialogTitle">Contact Tracy</h1>
    <p>Would you like to call or send a text?</p>
    <button class="choice" type="button" id="callTracy">Call Tracy</button>
    <button class="choice" type="button" id="textTracy">Send Text</button>
    <button class="choice cancel" type="button" id="cancelDialog">Cancel</button>
  </div>
</div>

<script>
(() => {
  const dialog = document.getElementById('choiceDialog');
  const openButton = document.getElementById('tracyButton');
  const closeDialog = () => {
    dialog.classList.remove('open');
    openButton.focus();
  };
  openButton.addEventListener('click', () => {
    dialog.classList.add('open');
    document.getElementById('callTracy').focus();
  });
  document.getElementById('callTracy').addEventListener('click', () => {
    window.location.href = 'tel:8183835882';
    closeDialog();
  });
  document.getElementById('textTracy').addEventListener('click', () => {
    window.location.href = 'sms:8183835882';
    closeDialog();
  });
  document.getElementById('cancelDialog').addEventListener('click', closeDialog);
  dialog.addEventListener('click', (event) => {
    if (event.target === dialog) closeDialog();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && dialog.classList.contains('open')) closeDialog();
  });
})();
</script>
