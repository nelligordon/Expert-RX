<div class="dialog-backdrop" id="choiceDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <div class="dialog">
    <h1 id="dialogTitle">Contact Tracy</h1>
    <p>Would you like to call or send a text?</p>
    <button class="choice" type="button" id="callTracy">Call Tracy</button>
    <button class="choice" type="button" id="textTracy">Send Text</button>
    <button class="choice cancel" type="button" id="cancelDialog">Cancel</button>
  </div>
</div>

<script>
(() => {
  const dialog = document.getElementById('choiceDialog');
  const openButton = document.getElementById('tracyButton');
  const closeDialog = () => {
    dialog.classList.remove('open');
    openButton.focus();
  };
  openButton.addEventListener('click', () => {
    dialog.classList.add('open');
    document.getElementById('callTracy').focus();
  });
  document.getElementById('callTracy').addEventListener('click', () => {
    window.location.href = 'tel:8183835882';
    closeDialog();
  });
  document.getElementById('textTracy').addEventListener('click', () => {
    window.location.href = 'sms:8183835882';
    closeDialog();
  });
  document.getElementById('cancelDialog').addEventListener('click', closeDialog);
  dialog.addEventListener('click', (event) => {
    if (event.target === dialog) closeDialog();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && dialog.classList.contains('open')) closeDialog();
  });
})();
</script>
